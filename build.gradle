plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.edanliahovetsky'
version = '0.9.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

repositories {
    maven {
        url = "${System.getProperty('user.home')}/wpilib/2026/maven"
    }
    mavenCentral()
    
    // WPILib Maven repository
    maven {
        url = "https://frcmaven.wpi.edu/artifactory/release/"
    }
}

ext {
    wpiVersion = "2026.1.1"
}

dependencies {
    // WPILib dependencies
    implementation "edu.wpi.first.wpilibj:wpilibj-java:${wpiVersion}"
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${wpiVersion}"
    implementation "edu.wpi.first.wpimath:wpimath-java:${wpiVersion}"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${wpiVersion}"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${wpiVersion}"
    // Required by Field2d/SmartDashboard (NTSendable); wpilibj does not pull it transitively here.
    compileOnly "edu.wpi.first.ntcore:ntcore-java:${wpiVersion}"
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:2.18.3"
    testCompileOnly "edu.wpi.first.ntcore:ntcore-java:${wpiVersion}"
    testCompileOnly "com.fasterxml.jackson.core:jackson-annotations:2.18.3"
    
    // JSON Simple for path loading
    implementation "com.googlecode.json-simple:json-simple:1.1.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "edu.wpi.first.hal:hal-java:${wpiVersion}"
    testRuntimeOnly "edu.wpi.first.ntcore:ntcore-java:${wpiVersion}"
    testRuntimeOnly "edu.wpi.first.wpinet:wpinet-java:${wpiVersion}"
    testRuntimeOnly "com.fasterxml.jackson.core:jackson-databind:2.19.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testRuntimeOnly "us.hebi.quickbuf:quickbuf-runtime:1.4"
}

def wpilibLocalMaven = file("${System.getProperty('user.home')}/wpilib/2026/maven")
def currentOperatingSystem = org.gradle.internal.os.OperatingSystem.current()
def wpilibNativeClassifier = currentOperatingSystem.isMacOsX()
    ? "osxuniversal"
    : currentOperatingSystem.isWindows()
        ? "windowsx86-64"
        : "linuxx86-64"
def wpilibNativeSharedPath = currentOperatingSystem.isMacOsX()
    ? "osx/universal/shared"
    : currentOperatingSystem.isWindows()
        ? "windows/x86-64/shared"
        : "linux/x86-64/shared"
def wpilibHalNativeZip = file("${wpilibLocalMaven}/edu/wpi/first/hal/hal-cpp/${wpiVersion}/hal-cpp-${wpiVersion}-${wpilibNativeClassifier}.zip")
def wpilibUtilNativeZip = file("${wpilibLocalMaven}/edu/wpi/first/wpiutil/wpiutil-cpp/${wpiVersion}/wpiutil-cpp-${wpiVersion}-${wpilibNativeClassifier}.zip")
def wpilibNtcoreNativeZip = file("${wpilibLocalMaven}/edu/wpi/first/ntcore/ntcore-cpp/${wpiVersion}/ntcore-cpp-${wpiVersion}-${wpilibNativeClassifier}.zip")
def wpilibNetNativeZip = file("${wpilibLocalMaven}/edu/wpi/first/wpinet/wpinet-cpp/${wpiVersion}/wpinet-cpp-${wpiVersion}-${wpilibNativeClassifier}.zip")
def wpilibTestNativeDir = layout.buildDirectory.dir("wpilib-test-natives")

tasks.register('extractWpilibTestNatives', Copy) {
    onlyIf {
        wpilibHalNativeZip.exists() &&
            wpilibUtilNativeZip.exists() &&
            wpilibNtcoreNativeZip.exists() &&
            wpilibNetNativeZip.exists()
    }
    from zipTree(wpilibUtilNativeZip)
    from zipTree(wpilibNetNativeZip)
    from zipTree(wpilibNtcoreNativeZip)
    from zipTree(wpilibHalNativeZip)
    into wpilibTestNativeDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configuration for JitPack
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            groupId = 'com.github.edanliahovetsky'
            artifactId = 'BLine-Lib'
            version = project.version
            
            pom {
                name = 'BLine-Lib'
                description = 'A path following library for FRC robots'
                url = 'https://github.com/edanliahovetsky/BLine-Lib'
                
                licenses {
                    license {
                        name = 'BSD 3-Clause License'
                        url = 'https://opensource.org/licenses/BSD-3-Clause'
                    }
                }
            }
        }
    }
}

// Ensure javadoc doesn't fail the build on warnings
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// Auto-copy javadoc to docs/ for GitHub Pages hosting
task copyJavadocToDocs(type: Copy) {
    dependsOn javadoc
    from "${buildDir}/docs/javadoc"
    into "${projectDir}/docs"
    // Preserve existing files like GIFs
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Run copyJavadocToDocs after javadoc generation
javadoc.finalizedBy copyJavadocToDocs

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('extractWpilibTestNatives')
    systemProperty 'java.library.path', "${layout.buildDirectory.get().asFile}/wpilib-test-natives/${wpilibNativeSharedPath}"
}
